name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
      - backend

jobs:
  bundle-and-deploy:
    name: Build & Package Production Deployment Artifacts
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Frontend/package-lock.json"

      - name: Build Production Frontend Dist
        run: |
          cd Frontend
          npm ci
          npm run build

      - name: Archive Production Frontend Distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 7

      - name: Archive Backend Service Bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-service
          path: |
            Backend/app/
            Backend/requirements.txt
            Backend/.env.example
          retention-days: 7

  ci-status:
    name: Verify CI Readiness
    uses: ./.github/workflows/ci.yml
